name: Apply Crime Scene Admin v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-crimescene-admin-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-crimescene-admin-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified admin assets
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/deploy-assets'
          apikey='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          fetch_asset() {
            local name="$1"
            local destination="$2"
            curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${apikey}" "${endpoint}/${name}" \
              | tr -d '\r\n ' \
              | base64 --decode \
              | gzip -dc > "${destination}"
          }
          mkdir -p pages-src
          fetch_asset admin-v3.js pages-src/admin-v3.js
          fetch_asset v3.css pages-src/v3.css
          fetch_asset build.mjs pages-src/build.mjs
          fetch_asset shell.html pages-src/shell.html
      - name: Verify source integrity and standalone admin build
        shell: bash
        run: |
          set -euo pipefail
          cat <<'SUMS' | sha256sum -c -
          4bc5994b228a78c1f0691285a9a5df043fa6d3b236ef7a640be396cbf9452d75  pages-src/admin-v3.js
          14fa92b914c9e2cde88831c085b63725c4f68d728430c5a1e24e8fddefa4fb4d  pages-src/v3.css
          52b2295064b7df6501f79aaea359a55d652388eb5dfad17b10259da181dcf557  pages-src/build.mjs
          69e07b25c014ffadf6c0b081f2731b6483f4c5bb90c9160e7c41fda9514b9718  pages-src/shell.html
          SUMS
          node --check pages-src/admin-v3.js
          node --check pages-src/build.mjs
          PAGES_BASE=/crimescene-admin ADMIN_ONLY=1 node pages-src/build.mjs
          test -s _site/assets/admin-v3.js
          test -s _site/assets/site.css
          grep -q 'admin-v3.js?v=20260816-10' _site/index.html
          ! grep -q 'assets/site.js' _site/index.html
          ! grep -q 'public-v3.js' _site/index.html
          grep -q 'noindex,nofollow,noarchive' _site/index.html
      - name: Verify Supabase v3 management API
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"3.0.0"'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/themes" > /tmp/themes.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/themes.json',encoding='utf-8'))['themes']
          expected={'A':(4,4,8),'B':(5,4,9),'C':(5,4,9),'D':(4,4,8)}
          actual={item['id']:(item['suspectCapacity'],item['detectiveCapacity'],item['totalCapacity']) for item in data}
          assert actual == expected, actual
          assert all(item['minPlayers']==4 for item in data)
          print('management data verified', actual)
          PY
      - name: Commit standalone admin console
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-src/admin-v3.js pages-src/v3.css pages-src/build.mjs pages-src/shell.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: rebuild operations console and theme management'
          git push origin HEAD:main
