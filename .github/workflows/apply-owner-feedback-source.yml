name: Apply owner feedback to admin source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-owner-feedback-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-owner-feedback-admin-source
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply owner instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-owner-feedback.py

      - name: Verify admin source and generated site
        env:
          PAGES_BASE: /crimescene-admin
          ADMIN_ONLY: '1'
        shell: bash
        run: |
          set -euo pipefail
          node --check pages-src/admin-final.js
          node pages-src/build.mjs
          node scripts/smoke-admin.cjs
          grep -q '고객 사이트 이름' pages-src/admin-final.js
          grep -q '사업자 상호' pages-src/admin-final.js
          grep -q '(주)싱글' pages-src/admin-final.js
          grep -q 'difficulty:""' pages-src/admin-final.js
          ! grep -q '난이도 표시' pages-src/admin-final.js
          ! grep -q 'current.difficulty' pages-src/admin-final.js
          test -s _site/assets/admin-final.js
          node --check _site/assets/admin-final.js

      - name: Commit completed admin source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-src/admin-final.js pages-src/shell.html
          if git diff --cached --quiet; then
            echo 'Admin source was already up to date.'
            exit 0
          fi
          git commit -m 'fix: apply owner feedback to admin source'
          git pull --rebase origin main
          git push origin HEAD:main
