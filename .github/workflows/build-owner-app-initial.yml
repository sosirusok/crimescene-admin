name: Build final owner reservation notification APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-owner-app-initial.yml'

permissions:
  contents: write

concurrency:
  group: owner-app-final-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify maintained real-time app source
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test -s android-owner-app/settings.gradle
            test -s android-owner-app/app/src/main/AndroidManifest.xml
            test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java
            test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/NotificationSyncService.java
            grep -q 'functions/v1/owner-app-api' android-owner-app/app/src/main/java/com/crimesceneplay/owner/AppConfig.java
            grep -q 'APP_VERSION = "1.1.1"' android-owner-app/app/src/main/java/com/crimesceneplay/owner/AppConfig.java
            grep -q 'waitForNew' android-owner-app/app/src/main/java/com/crimesceneplay/owner/ApiClient.java
            grep -q 'versionCode 3' android-owner-app/app/build.gradle
            grep -q 'versionName "1.1.1"' android-owner-app/app/build.gradle
            grep -q 'foregroundServiceType="remoteMessaging"' android-owner-app/app/src/main/AndroidManifest.xml
          } 2>&1 | tee /tmp/source.log

      - name: Verify real-time owner notification server
        id: api
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/owner-app-api'
            key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
            curl --retry 8 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" > /tmp/owner-health.json
            cat /tmp/owner-health.json
            grep -q '"version":"1.1.1"' /tmp/owner-health.json
            grep -q '"realtime":"LONG_POLL"' /tmp/owner-health.json
            code=$(curl -sS -o /tmp/owner-unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/wait?after=0")
            cat /tmp/owner-unauthorized.json
            test "$code" = '401'
            grep -q '다시 연결' /tmp/owner-unauthorized.json
          } 2>&1 | tee /tmp/api.log

      - name: Install Android SDK packages
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          } 2>&1 | tee /tmp/sdk.log

      - name: Create private update signing key
        id: signing
        if: steps.source.outcome == 'success' && steps.sdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            password=$(openssl rand -hex 24)
            printf '%s' "$password" > /tmp/Crimescene-Owner-Update-Key-password.txt
            keytool -genkeypair -v \
              -keystore /tmp/Crimescene-Owner-Update-Key.jks \
              -storepass "$password" \
              -keypass "$password" \
              -alias crimescene-owner \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname 'CN=Crimescene Play Owner App, OU=Seomyeon Branch, O=Crimescene Play, L=Busan, C=KR'
            cat > android-owner-app/signing.properties <<EOF
            storeFile=/tmp/Crimescene-Owner-Update-Key.jks
            storePassword=${password}
            keyAlias=crimescene-owner
            keyPassword=${password}
            EOF
            test -s /tmp/Crimescene-Owner-Update-Key.jks
          } 2>&1 | tee /tmp/signing.log

      - name: Build signed release APK
        id: assemble
        if: steps.source.outcome == 'success' && steps.sdk.outcome == 'success' && steps.signing.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            gradle -p android-owner-app --no-daemon clean :app:assembleRelease
            test -s android-owner-app/app/build/outputs/apk/release/app-release.apk
          } 2>&1 | tee /tmp/build.log

      - name: Verify signed APK
        id: verify
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            apk='android-owner-app/app/build/outputs/apk/release/app-release.apk'
            apksigner verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt
            aapt dump badging "$apk" | tee /tmp/apk-badging.txt
            grep -q "package: name='com.crimesceneplay.owner' versionCode='3' versionName='1.1.1'" /tmp/apk-badging.txt
          } 2>&1 | tee /tmp/verify.log

      - name: Prepare delivery files
        id: prepare
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p /tmp/owner-app-delivery android-owner-app/dist
            apk='android-owner-app/app/build/outputs/apk/release/app-release.apk'
            cp "$apk" /tmp/owner-app-delivery/Crimescene-Owner-App.apk
            cp "$apk" android-owner-app/dist/Crimescene-Owner-App.apk
            cp /tmp/Crimescene-Owner-Update-Key.jks /tmp/owner-app-delivery/
            cp /tmp/Crimescene-Owner-Update-Key-password.txt /tmp/owner-app-delivery/
            cp /tmp/apk-signature.txt /tmp/owner-app-delivery/Crimescene-Owner-App-signature.txt
            cp /tmp/apk-badging.txt /tmp/owner-app-delivery/Crimescene-Owner-App-package.txt
            cat > /tmp/owner-app-delivery/Crimescene-Owner-Signing-Backup-README.txt <<'EOF'
            크라임씬플레이 예약 알림 앱 서명 백업

            패키지: com.crimesceneplay.owner
            서명 별칭: crimescene-owner

            Crimescene-Owner-Update-Key.jks와 비밀번호 파일을 함께 보관하세요.
            향후 앱 업데이트는 반드시 같은 키로 서명해야 기존 앱 위에 설치됩니다.
            두 파일을 GitHub, 카카오톡, 공개 링크, 공용 드라이브에 올리지 마세요.
            EOF
            (cd /tmp/owner-app-delivery && sha256sum Crimescene-Owner-App.apk > Crimescene-Owner-App.apk.sha256)
            cp /tmp/owner-app-delivery/Crimescene-Owner-App.apk.sha256 android-owner-app/dist/
            cp /tmp/apk-signature.txt android-owner-app/dist/Crimescene-Owner-App-signature.txt
          } 2>&1 | tee /tmp/prepare.log

      - uses: actions/upload-artifact@v4
        if: steps.prepare.outcome == 'success'
        with:
          name: Crimescene-Owner-App-final
          path: /tmp/owner-app-delivery
          if-no-files-found: error
          retention-days: 7

      - name: Commit build report and signed APK
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          API_OUTCOME: ${{ steps.api.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# 크라임씬플레이 예약 알림 앱 최종 빌드 결과'
            echo
            echo "- 소스 확인: ${SOURCE_OUTCOME:-skipped}"
            echo "- 서버 확인: ${API_OUTCOME:-skipped}"
            echo "- Android SDK: ${SDK_OUTCOME:-skipped}"
            echo "- 서명키 생성: ${SIGNING_OUTCOME:-skipped}"
            echo "- APK 빌드: ${ASSEMBLE_OUTCOME:-skipped}"
            echo "- APK 검증: ${VERIFY_OUTCOME:-skipped}"
            echo "- 전달 파일 준비: ${PREPARE_OUTCOME:-skipped}"
            echo '- 앱 버전: 1.1.1'
            echo '- 패키지: com.crimesceneplay.owner'
            echo '- 데이터 연결: Supabase PostgreSQL 예약 알림 큐'
            echo '- 수신 방식: 20초 유지 연결을 반복하는 실시간 long-poll'
            echo "- GitHub Actions 실행 번호: ${GITHUB_RUN_ID}"
            echo '- 산출물 이름: Crimescene-Owner-App-final'
            echo "- 실행 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            if [ "${PREPARE_OUTCOME:-skipped}" = 'success' ]; then
              echo '결과: 성공'
            else
              echo '결과: 실패'
              echo
              echo '## 확인 로그'
              echo '```text'
              for log in /tmp/source.log /tmp/api.log /tmp/sdk.log /tmp/signing.log /tmp/build.log /tmp/verify.log /tmp/prepare.log; do
                if [ -s "$log" ]; then
                  echo "--- $(basename "$log") ---"
                  tail -n 100 "$log"
                fi
              done
              echo '```'
            fi
          } > android-owner-app/BUILD_RESULT.md

          rm -f android-owner-app/signing.properties
          rm -rf android-owner-app/.gradle android-owner-app/app/build
          rm -f android-owner-app/dist/Crimescene-Owner-App-unsigned.apk android-owner-app/dist/Crimescene-Owner-App-unsigned.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A android-owner-app
          if ! git diff --cached --quiet; then
            git commit -m 'build: report signed real-time owner notification APK'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require successful signed APK
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        shell: bash
        run: test "${PREPARE_OUTCOME:-skipped}" = 'success'
