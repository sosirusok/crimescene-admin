name: Build owner notification APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-owner-app-initial.yml'
      - '.owner-app-payload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-app-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore owner app source
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cat .owner-app-payload/part* > /tmp/owner-app-source.b64
            base64 -d /tmp/owner-app-source.b64 > /tmp/owner-app-source.tar.xz
            echo '7f7eb82e2023e67c73fea95c0f5df8a842faa64a3ae2b52c8bf24097799ad67c  /tmp/owner-app-source.tar.xz' | sha256sum -c -
            rm -rf android-owner-app
            tar -xJf /tmp/owner-app-source.tar.xz -C .
            test -s android-owner-app/settings.gradle
            test -s android-owner-app/app/src/main/AndroidManifest.xml
            test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java
          } 2>&1 | tee /tmp/restore.log

      - name: Verify owner notification API
        id: api
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/owner-app-api'
            key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
            curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"1.0.0"'
            code=$(curl -sS -o /tmp/owner-unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/notifications?after=0")
            test "$code" = '401'
            grep -q '다시 연결' /tmp/owner-unauthorized.json
          } 2>&1 | tee /tmp/api.log

      - name: Install Android SDK packages
        id: sdk
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          } 2>&1 | tee /tmp/sdk.log

      - name: Build unsigned release APK
        id: assemble
        if: steps.restore.outcome == 'success' && steps.sdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-owner-app --no-daemon :app:assembleRelease 2>&1 | tee /tmp/build.log
          test -s android-owner-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Commit source, APK and build report
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          API_OUTCOME: ${{ steps.api.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-owner-app/dist
          apk='android-owner-app/app/build/outputs/apk/release/app-release-unsigned.apk'
          if [ -s "$apk" ]; then
            cp "$apk" android-owner-app/dist/Crimescene-Owner-App-unsigned.apk
            sha256sum android-owner-app/dist/Crimescene-Owner-App-unsigned.apk > android-owner-app/dist/Crimescene-Owner-App-unsigned.apk.sha256
          fi

          {
            echo '# 크라임씬플레이 예약 알림 앱 빌드 결과'
            echo
            echo "- 소스 복원: ${RESTORE_OUTCOME:-skipped}"
            echo "- 서버 확인: ${API_OUTCOME:-skipped}"
            echo "- Android SDK: ${SDK_OUTCOME:-skipped}"
            echo "- APK 빌드: ${ASSEMBLE_OUTCOME:-skipped}"
            echo "- 실행 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            if [ -s "$apk" ]; then
              echo '결과: 성공'
            else
              echo '결과: 실패'
              echo
              echo '## 마지막 빌드 로그'
              echo '```text'
              for log in /tmp/restore.log /tmp/api.log /tmp/sdk.log /tmp/build.log; do
                if [ -s "$log" ]; then
                  echo "--- $(basename "$log") ---"
                  tail -n 120 "$log"
                fi
              done
              echo '```'
            fi
          } > android-owner-app/BUILD_RESULT.md

          rm -f android-owner-app/signing.properties
          rm -rf android-owner-app/.gradle android-owner-app/app/build
          rm -f android-owner-app/.wait* android-owner-app/build-state.txt android-owner-app/build-requested.txt android-owner-app/.build-marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A android-owner-app
          if ! git diff --cached --quiet; then
            git commit -m 'build: add owner notification app source and APK result'
            git push origin HEAD:main
          fi

          test -s android-owner-app/dist/Crimescene-Owner-App-unsigned.apk
