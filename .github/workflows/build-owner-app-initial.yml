name: Build final owner reservation notification APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-owner-app-initial.yml'

permissions:
  contents: write

concurrency:
  group: owner-app-final-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify real-time source and server
        shell: bash
        run: |
          set -euo pipefail
          test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java
          test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/NotificationSyncService.java
          grep -q 'functions/v1/owner-app-api' android-owner-app/app/src/main/java/com/crimesceneplay/owner/AppConfig.java
          grep -q 'APP_VERSION = "1.1.1"' android-owner-app/app/src/main/java/com/crimesceneplay/owner/AppConfig.java
          grep -q 'waitForNew' android-owner-app/app/src/main/java/com/crimesceneplay/owner/ApiClient.java
          grep -q 'versionCode 3' android-owner-app/app/build.gradle
          grep -q 'versionName "1.1.1"' android-owner-app/app/build.gradle
          grep -q 'foregroundServiceType="remoteMessaging"' android-owner-app/app/src/main/AndroidManifest.xml
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/owner-app-api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 8 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" > /tmp/owner-health.json
          grep -q '"version":"1.1.1"' /tmp/owner-health.json
          grep -q '"realtime":"LONG_POLL"' /tmp/owner-health.json
          code=$(curl -sS -o /tmp/owner-unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/wait?after=0")
          test "$code" = '401'
          grep -q '다시 연결' /tmp/owner-unauthorized.json

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"

      - name: Create private update signing key
        shell: bash
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 24)
          printf '%s' "$password" > /tmp/Crimescene-Owner-Update-Key-password.txt
          keytool -genkeypair -v \
            -keystore /tmp/Crimescene-Owner-Update-Key.jks \
            -storepass "$password" \
            -keypass "$password" \
            -alias crimescene-owner \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname 'CN=Crimescene Play Owner App, OU=Seomyeon Branch, O=Crimescene Play, L=Busan, C=KR'
          printf '%s\n' \
            'storeFile=/tmp/Crimescene-Owner-Update-Key.jks' \
            "storePassword=${password}" \
            'keyAlias=crimescene-owner' \
            "keyPassword=${password}" \
            > android-owner-app/signing.properties

      - name: Build and verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-owner-app --no-daemon clean :app:assembleRelease
          apk='android-owner-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.crimesceneplay.owner' versionCode='3' versionName='1.1.1'" /tmp/apk-badging.txt

      - name: Prepare private delivery bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/owner-app-delivery android-owner-app/dist
          apk='android-owner-app/app/build/outputs/apk/release/app-release.apk'
          cp "$apk" /tmp/owner-app-delivery/Crimescene-Owner-App.apk
          cp "$apk" android-owner-app/dist/Crimescene-Owner-App.apk
          cp /tmp/Crimescene-Owner-Update-Key.jks /tmp/owner-app-delivery/
          cp /tmp/Crimescene-Owner-Update-Key-password.txt /tmp/owner-app-delivery/
          cp /tmp/apk-signature.txt /tmp/owner-app-delivery/Crimescene-Owner-App-signature.txt
          cp /tmp/apk-badging.txt /tmp/owner-app-delivery/Crimescene-Owner-App-package.txt
          printf '%s\n' \
            '크라임씬플레이 예약 알림 앱 서명 백업' \
            '' \
            '패키지: com.crimesceneplay.owner' \
            '서명 별칭: crimescene-owner' \
            '' \
            'Crimescene-Owner-Update-Key.jks와 비밀번호 파일을 함께 보관하세요.' \
            '향후 앱 업데이트는 반드시 같은 키로 서명해야 기존 앱 위에 설치됩니다.' \
            '두 파일을 GitHub, 카카오톡, 공개 링크, 공용 드라이브에 올리지 마세요.' \
            > /tmp/owner-app-delivery/Crimescene-Owner-Signing-Backup-README.txt
          (cd /tmp/owner-app-delivery && sha256sum Crimescene-Owner-App.apk > Crimescene-Owner-App.apk.sha256)
          cp /tmp/owner-app-delivery/Crimescene-Owner-App.apk.sha256 android-owner-app/dist/
          cp /tmp/apk-signature.txt android-owner-app/dist/Crimescene-Owner-App-signature.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Crimescene-Owner-App-final
          path: /tmp/owner-app-delivery
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified APK and build report
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '# 크라임씬플레이 예약 알림 앱 최종 빌드 결과' \
            '' \
            '- 결과: 성공' \
            '- 앱 버전: 1.1.1' \
            '- 패키지: com.crimesceneplay.owner' \
            '- 데이터 연결: Supabase PostgreSQL 예약 알림 큐' \
            '- 수신 방식: 20초 유지 연결을 반복하는 실시간 long-poll' \
            '- APK 서명: 검증 완료' \
            "- GitHub Actions 실행 번호: ${GITHUB_RUN_ID}" \
            '- 산출물 이름: Crimescene-Owner-App-final' \
            "- 실행 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            > android-owner-app/BUILD_RESULT.md
          rm -f android-owner-app/signing.properties
          rm -rf android-owner-app/.gradle android-owner-app/app/build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-owner-app/BUILD_RESULT.md android-owner-app/dist/Crimescene-Owner-App.apk android-owner-app/dist/Crimescene-Owner-App.apk.sha256 android-owner-app/dist/Crimescene-Owner-App-signature.txt
          git commit -m 'build: publish signed real-time owner notification APK'
          git pull --rebase origin main
          git push origin HEAD:main
