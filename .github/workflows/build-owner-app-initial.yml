name: Build initial owner notification APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-owner-app-initial.yml'
      - '.owner-app-payload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-app-initial-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore owner app source
        shell: bash
        run: |
          set -euo pipefail
          cat .owner-app-payload/part* > /tmp/owner-app-source.b64
          base64 -d /tmp/owner-app-source.b64 > /tmp/owner-app-source.tar.xz
          echo '7f7eb82e2023e67c73fea95c0f5df8a842faa64a3ae2b52c8bf24097799ad67c  /tmp/owner-app-source.tar.xz' | sha256sum -c -
          rm -rf android-owner-app
          tar -xJf /tmp/owner-app-source.tar.xz -C .
          test -s android-owner-app/settings.gradle
          test -s android-owner-app/app/src/main/AndroidManifest.xml
          test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java

      - name: Verify owner notification API
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/owner-app-api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"1.0.0"'
          code=$(curl -sS -o /tmp/owner-unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/notifications?after=0")
          test "$code" = '401'
          grep -q '다시 연결' /tmp/owner-unauthorized.json

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Create private signing key for the first release
        shell: bash
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 24)
          printf '%s' "$password" > /tmp/Crimescene-Owner-Update-Key-password.txt
          keytool -genkeypair -v \
            -keystore /tmp/Crimescene-Owner-Update-Key.jks \
            -storepass "$password" \
            -keypass "$password" \
            -alias crimescene-owner \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname 'CN=Crimescene Play Owner App, OU=Seomyeon Branch, O=Crimescene Play, L=Busan, C=KR'
          cat > android-owner-app/signing.properties <<EOF
          storeFile=/tmp/Crimescene-Owner-Update-Key.jks
          storePassword=${password}
          keyAlias=crimescene-owner
          keyPassword=${password}
          EOF

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-owner-app --no-daemon :app:assembleRelease
          apk='android-owner-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt

      - name: Prepare delivery bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/owner-app-delivery
          cp android-owner-app/app/build/outputs/apk/release/app-release.apk /tmp/owner-app-delivery/Crimescene-Owner-App.apk
          cp /tmp/Crimescene-Owner-Update-Key.jks /tmp/owner-app-delivery/
          cp /tmp/Crimescene-Owner-Update-Key-password.txt /tmp/owner-app-delivery/
          cp /tmp/apk-signature.txt /tmp/owner-app-delivery/Crimescene-Owner-App-signature.txt
          cat > /tmp/owner-app-delivery/Crimescene-Owner-Signing-Backup-README.txt <<'EOF'
          크라임씬플레이 예약 알림 앱 서명 백업

          패키지: com.crimesceneplay.owner
          서명 별칭: crimescene-owner

          Crimescene-Owner-Update-Key.jks와 비밀번호 파일을 함께 보관하세요.
          향후 앱 업데이트는 반드시 같은 키로 서명해야 기존 앱 위에 설치됩니다.
          두 파일을 GitHub, 카카오톡, 공개 링크, 공용 드라이브에 올리지 마세요.
          EOF
          (cd /tmp/owner-app-delivery && sha256sum Crimescene-Owner-App.apk > Crimescene-Owner-App.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: Crimescene-Owner-App-initial
          path: /tmp/owner-app-delivery
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified app source
        shell: bash
        run: |
          set -euo pipefail
          rm -f android-owner-app/signing.properties
          rm -rf android-owner-app/.gradle android-owner-app/app/build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A android-owner-app
          git commit -m 'feat: add owner reservation notification Android app'
          git push origin HEAD:main
