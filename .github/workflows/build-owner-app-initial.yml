name: Build owner notification APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-owner-app-initial.yml'
      - 'android-owner-app/settings.gradle'
      - 'android-owner-app/build.gradle'
      - 'android-owner-app/gradle.properties'
      - 'android-owner-app/app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify maintained app source
        shell: bash
        run: |
          set -euo pipefail
          test -s android-owner-app/settings.gradle
          test -s android-owner-app/app/src/main/AndroidManifest.xml
          test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java
          test -s android-owner-app/app/src/main/java/com/crimesceneplay/owner/NotificationSyncService.java
          grep -q 'functions/v1/owner-app-api' android-owner-app/app/src/main/java/com/crimesceneplay/owner/AppConfig.java
          grep -q 'versionName "1.1.1"' android-owner-app/app/build.gradle

      - name: Verify owner notification server
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/owner-app-api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"1.1.1"'
          code=$(curl -sS -o /tmp/owner-unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/notifications?after=0")
          test "$code" = '401'
          grep -q '다시 연결' /tmp/owner-unauthorized.json

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-owner-app --no-daemon :app:assembleRelease
          test -s android-owner-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Commit verified APK and build report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-owner-app/dist
          cp android-owner-app/app/build/outputs/apk/release/app-release-unsigned.apk android-owner-app/dist/Crimescene-Owner-App-unsigned.apk
          sha256sum android-owner-app/dist/Crimescene-Owner-App-unsigned.apk > android-owner-app/dist/Crimescene-Owner-App-unsigned.apk.sha256
          cat > android-owner-app/BUILD_RESULT.md <<EOF
          # 크라임씬플레이 예약 알림 앱 빌드 결과

          - 서버 확인: success
          - Android SDK: success
          - APK 빌드: success
          - 앱 버전: 1.1.1
          - 실행 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ')

          결과: 성공
          EOF
          rm -rf android-owner-app/.gradle android-owner-app/app/build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-owner-app/dist android-owner-app/BUILD_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish owner notification app 1.1.1'
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Crimescene-Owner-App-unsigned-1.1.1
          path: android-owner-app/dist/Crimescene-Owner-App-unsigned.apk
          if-no-files-found: error
          retention-days: 7
