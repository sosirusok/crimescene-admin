name: Finalize admin site repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove one-time tooling and simplify normal deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("      - 'scripts/apply-owner-feedback.py'\n", "")
          text = text.replace("      - name: Apply owner feedback\n        run: python3 scripts/apply-owner-feedback.py\n", "")
          path.write_text(text, encoding='utf-8')
          PY

          rm -f \
            .github/workflows/apply-owner-feedback.yml \
            .github/workflows/apply-owner-feedback-admin.yml \
            .github/workflows/apply-owner-feedback-to-admin.yml \
            .github/workflows/final-cleanup.yml \
            scripts/apply-owner-feedback.py

      - name: Verify final admin source without temporary patch scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check pages-src/admin-final.js
          ADMIN_ONLY=1 PAGES_BASE=/crimescene-admin node pages-src/build.mjs
          node scripts/smoke-admin.cjs

          test -s _site/index.html
          test -s _site/assets/admin-final.js
          grep -q '고객 사이트 이름' _site/assets/admin-final.js
          grep -q '사업자 상호' _site/assets/admin-final.js
          grep -q '(주)싱글' _site/assets/admin-final.js
          grep -q 'difficulty:""' _site/assets/admin-final.js
          ! grep -q '난이도 표시' _site/assets/admin-final.js
          ! grep -q 'current.difficulty' _site/assets/admin-final.js
          ! grep -q 'scripts/apply-owner-feedback.py' .github/workflows/pages.yml

      - name: Commit final clean repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize admin site after verified owner feedback'
          git pull --rebase origin main
          git push origin HEAD:main
