name: Final admin delivery verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-delivery-verification.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: read

concurrency:
  group: final-admin-delivery
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Final repository cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/pages.yml')
          text=path.read_text(encoding='utf-8')
          text=text.replace("      - 'scripts/apply-owner-feedback.py'\n","")
          text=text.replace("      - name: Apply owner feedback\n        run: python3 scripts/apply-owner-feedback.py\n","")
          path.write_text(text,encoding='utf-8')
          PY

          rm -f \
            .github/workflows/apply-owner-feedback.yml \
            .github/workflows/apply-owner-feedback-admin.yml \
            .github/workflows/apply-owner-feedback-to-admin.yml \
            .github/workflows/final-cleanup.yml \
            .github/workflows/final-delivery-verification.yml \
            scripts/apply-owner-feedback.py

      - name: Verify final admin source and generated site
        shell: bash
        run: |
          set -euo pipefail
          node --check pages-src/admin-final.js
          ADMIN_ONLY=1 PAGES_BASE=/crimescene-admin node pages-src/build.mjs
          node scripts/smoke-admin.cjs

          test -s _site/index.html
          test -s _site/assets/admin-final.js
          grep -q '고객 사이트 이름' _site/assets/admin-final.js
          grep -q '사업자 상호' _site/assets/admin-final.js
          grep -q '(주)싱글' _site/assets/admin-final.js
          grep -q 'difficulty:""' _site/assets/admin-final.js
          ! grep -q '난이도 표시' _site/assets/admin-final.js
          ! grep -q 'current.difficulty' _site/assets/admin-final.js
          ! grep -q 'scripts/apply-owner-feedback.py' .github/workflows/pages.yml

      - name: Commit clean production source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: leave only permanent admin deployment tooling'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait for the clean admin site
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?per_page=30"
          run_id=''
          for attempt in $(seq 1 60); do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" > /tmp/pages-runs.json
            run_id=$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/pages-runs.json)
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"

          conclusion=''
          for attempt in $(seq 1 150); do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/pages-run.json
            status=$(jq -r '.status' /tmp/pages-run.json)
            conclusion=$(jq -r '.conclusion // ""' /tmp/pages-run.json)
            [ "$status" = completed ] && break
            sleep 4
          done
          test "$conclusion" = success
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify the public admin delivery files
        shell: bash
        run: |
          set -euo pipefail
          base='https://sosirusok.github.io/crimescene-admin/'
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsSL --retry 2 --retry-all-errors "${base}?final=${GITHUB_RUN_ID}-${attempt}" -o /tmp/admin.html; then
              if grep -q 'admin-final.js?v=' /tmp/admin.html; then ready=1; break; fi
            fi
            sleep 4
          done
          test "$ready" = 1
          script_path=$(grep -oE 'assets/admin-final\.js\?v=[^" ]+' /tmp/admin.html | head -1)
          test -n "$script_path"
          curl -fsSL --retry 4 --retry-all-errors "${base}${script_path}" -o /tmp/admin-final.js
          node --check /tmp/admin-final.js
          grep -q '고객 사이트 이름' /tmp/admin-final.js
          grep -q '사업자 상호' /tmp/admin-final.js
          grep -q '(주)싱글' /tmp/admin-final.js
          ! grep -q '난이도 표시' /tmp/admin-final.js
          ! grep -q 'current.difficulty' /tmp/admin-final.js
          grep -q 'noindex,nofollow,noarchive' /tmp/admin.html

      - name: Record final admin delivery status
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PAGES_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/final-delivery-status.md <<EOF
          # 관리자 사이트 최종 인수 검증

          - 결과: 성공
          - 관리자 사이트: https://sosirusok.github.io/crimescene-admin/
          - 정리된 소스 커밋: ${SOURCE_SHA}
          - 최종 Pages 실행 번호: ${PAGES_RUN_ID}
          - GitHub Pages 빌드와 배포: 성공
          - 실제 배포 자바스크립트 문법 검사: 성공
          - 사업자 상호 구분 표시: 적용
          - 고객 사이트 이름과 사업자 상호: 구분 완료
          - 테마 난이도 입력과 표시: 제거 완료
          - 고객 검색 노출 차단: 확인
          - 일회성 수정 워크플로: 제거 완료
          - 확인 시각: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/final-delivery-status.md
          git commit -m 'docs: record final admin delivery verification'
          git pull --rebase origin main
          git push origin HEAD:main
