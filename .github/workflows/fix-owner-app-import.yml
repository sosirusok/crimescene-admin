name: Apply final owner app import correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-owner-app-import.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Android ColorStateList import
        run: |
          set -euo pipefail
          file='android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java'
          grep -q '^import android.content.ColorStateList;$' "$file"
          sed -i 's/^import android\.content\.ColorStateList;$/import android.content.res.ColorStateList;/' "$file"
          grep -q '^import android.content.res.ColorStateList;$' "$file"

      - name: Commit correction and remove temporary files
        run: |
          rm -f .github/workflows/fix-owner-app-import.yml android-owner-app/ACTION_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/fix-owner-app-import.yml android-owner-app/ACTION_STATUS.json android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java
          git commit -m 'fix: correct Android ColorStateList import'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start final verification again
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-owner-app-final.yml --repo "$GITHUB_REPOSITORY" --ref main
