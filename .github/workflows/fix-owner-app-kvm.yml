name: Enable hardware acceleration for final owner app verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-owner-app-kvm.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM in the final verification workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-owner-app-final.yml')
          text = path.read_text()

          marker = '''      - name: Add swap space for the Android emulator
'''
          kvm = '''      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

'''
          if 'Enable KVM hardware acceleration' not in text:
              if marker not in text:
                  raise SystemExit('swap step marker not found')
              text = text.replace(marker, kvm + marker, 1)

          text = text.replace('          ram-size: 1536M\n', '          ram-size: 1024M\n', 1)
          text = text.replace('          heap-size: 384M\n', '          heap-size: 256M\n          emulator-boot-timeout: 900\n          disable-linux-hw-accel: false\n', 1)
          path.write_text(text)
          PY

          grep -q 'Enable KVM hardware acceleration' .github/workflows/build-owner-app-final.yml
          grep -q 'emulator-boot-timeout: 900' .github/workflows/build-owner-app-final.yml
          grep -q 'disable-linux-hw-accel: false' .github/workflows/build-owner-app-final.yml

      - name: Commit the corrected verification workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-owner-app-kvm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'ci: enable KVM for Android 14 verification'
          git pull --rebase origin main
          git push origin HEAD:main
