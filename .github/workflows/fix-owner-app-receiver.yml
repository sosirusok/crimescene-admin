name: Apply final receiver compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-owner-app-receiver.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark the guarded legacy receiver registration
        run: |
          set -euo pipefail
          file='android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java'
          grep -q '^import android.Manifest;$' "$file"
          grep -q 'protected void onStart()' "$file"
          sed -i '/^import android.Manifest;$/a import android.annotation.SuppressLint;' "$file"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java')
          text = path.read_text()
          needle = '    @Override\n    protected void onStart() {'
          replacement = '    @SuppressLint("UnspecifiedRegisterReceiverFlag")\n    @Override\n    protected void onStart() {'
          if needle not in text:
              raise SystemExit('onStart marker not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          grep -q '^import android.annotation.SuppressLint;$' "$file"
          grep -q '@SuppressLint("UnspecifiedRegisterReceiverFlag")' "$file"

      - name: Commit fix and remove temporary status files
        run: |
          rm -f .github/workflows/fix-owner-app-receiver.yml android-owner-app/ACTION_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/fix-owner-app-receiver.yml android-owner-app/ACTION_STATUS.json android-owner-app/app/src/main/java/com/crimesceneplay/owner/MainActivity.java
          git commit -m 'fix: mark guarded receiver registration for Android 8 to 14'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run the complete final verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-owner-app-final.yml --repo "$GITHUB_REPOSITORY" --ref main
