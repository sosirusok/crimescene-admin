name: Deploy Admin GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages-src/admin-final.js'
      - 'pages-src/final.css'
      - 'pages-src/shell.html'
      - 'pages-src/build.mjs'
      - 'scripts/smoke-admin.cjs'
      - 'public/favicon.svg'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build admin site
        env:
          PAGES_BASE: /crimescene-admin
          ADMIN_ONLY: "1"
        run: node pages-src/build.mjs
      - name: Verify generated admin site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/final.css
          test -s _site/assets/admin-final.js
          node --check _site/assets/admin-final.js
          node scripts/smoke-admin.cjs
          grep -q 'admin-final.js?v=20260816-30' _site/index.html
          grep -q 'final.css?v=20260816-30' _site/index.html
          grep -q 'noindex,nofollow,noarchive' _site/index.html
          grep -q 'Disallow: /' _site/robots.txt
          ! grep -Eq 'Supabase|OWNER|AES-GCM|서비스 역할' _site/assets/admin-final.js
      - name: Verify management API
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"4.0.1"'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/bootstrap" > /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/bootstrap.json',encoding='utf-8'))
          assert data['settings']['paymentMode'] == 'ONSITE'
          assert data['payment']['onlineEnabled'] is False
          assert data['payment']['integrationReady'] is False
          print('Payment safety lock verified')
          PY
          code=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/admin/dashboard")
          test "$code" = "401"
          grep -q '관리자 로그인이 필요합니다' /tmp/unauthorized.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live admin site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --retry 2 --retry-all-errors -fsSL "${base}?sha=${GITHUB_SHA}" -o /tmp/admin.html; then
              if grep -q 'admin-final.js?v=20260816-30' /tmp/admin.html; then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = "1"
          curl --retry 4 --retry-all-errors -fsSL "${base}assets/admin-final.js?v=20260816-30" -o /tmp/admin-final.js
          curl --retry 4 --retry-all-errors -fsSL "${base}assets/final.css?v=20260816-30" -o /tmp/final.css
          node --check /tmp/admin-final.js
          test -s /tmp/final.css
          grep -q 'noindex,nofollow,noarchive' /tmp/admin.html
          echo "Live admin site verified: ${base}"
