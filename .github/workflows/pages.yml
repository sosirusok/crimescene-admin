name: Deploy Admin GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages-src/admin-final.js'
      - 'pages-src/admin-date.css'
      - 'pages-src/final.css'
      - 'pages-src/shell.html'
      - 'pages-src/build.mjs'
      - 'scripts/smoke-admin.cjs'
      - 'scripts/smoke-admin-reservations.cjs'
      - 'scripts/smoke-admin-payments.cjs'
      - 'public/favicon.svg'
      - 'public/fonts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build admin site
        env:
          PAGES_BASE: /crimescene-admin
          ADMIN_ONLY: "1"
        run: node pages-src/build.mjs
      - name: Verify generated admin site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/final.css
          test -s _site/assets/admin-date.css
          test -s _site/assets/admin-final.js
          test -s _site/fonts/Pretendard-Regular.woff2
          test -s _site/fonts/Pretendard-ExtraBold.woff2
          node --check _site/assets/admin-final.js
          node scripts/smoke-admin.cjs
          node scripts/smoke-admin-reservations.cjs
          node scripts/smoke-admin-payments.cjs
          grep -q 'admin-final.js?v=' _site/index.html
          grep -q 'final.css?v=' _site/index.html
          grep -q 'admin-date.css?v=' _site/index.html
          grep -q 'Pretendard-Regular.woff2' _site/assets/admin-date.css
          grep -q 'noindex,nofollow,noarchive' _site/index.html
          grep -q 'Disallow: /' _site/robots.txt
          grep -q 'NICEPAY 온라인 카드 결제' _site/assets/admin-final.js
          grep -q '서버 승인·웹훅 모듈' _site/assets/admin-final.js
          grep -q 'NICEPAY 승인·웹훅 결과로 자동 반영됩니다' _site/assets/admin-final.js
          grep -q '/admin/payments/nicepay/cancel' _site/assets/admin-final.js
          grep -q 'data-confirm-nicepay-cancel' _site/assets/admin-final.js
          grep -q 'VERIFYING:"결제 확인 중"' _site/assets/admin-final.js
          ! grep -q 'KISPG' _site/assets/admin-final.js
          grep -q '고객 사이트 이름' _site/assets/admin-final.js
          grep -q '오늘 예약만 보기' _site/assets/admin-final.js
          grep -q '오늘 이후 전체' _site/assets/admin-final.js
          grep -q '날짜 직접 선택' _site/assets/admin-final.js
          grep -q '사업자 상호' _site/assets/admin-final.js
          grep -q '(주)싱글' _site/assets/admin-final.js
          grep -q 'difficulty:""' _site/assets/admin-final.js
          ! grep -q '난이도 표시' _site/assets/admin-final.js
          ! grep -q 'current.difficulty' _site/assets/admin-final.js
          ! grep -Eq 'Supabase|OWNER|AES-GCM|서비스 역할' _site/assets/admin-final.js
      - name: Verify management API
        shell: bash
        run: |
          set -euo pipefail
          api='https://jhjbiejqtbidloxcwryr.supabase.co/functions/v1/api'
          key='sb_publishable_mA5DOfPA-ExloawT3aJpNw_2PeVgEEc'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"version":"5.0.0"'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/health" | grep -q '"paymentProvider":"NICEPAY"'
          curl --retry 4 --retry-all-errors -fsSL -H "apikey: ${key}" "${api}/bootstrap" > /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/bootstrap.json',encoding='utf-8'))
          settings=data['settings']
          assert isinstance(settings.get('bookingWindowDays'), int)
          assert settings['bookingWindowDays'] == 15, settings
          assert settings.get('paymentMode') in {'ONSITE','ONLINE'}
          for field in ('storeName','branchName','phone','addressRoad'):
              assert isinstance(settings.get(field), str) and settings[field].strip(), (field, settings)
          payment=data.get('payment') or {}
          assert isinstance(payment.get('onlineEnabled'), bool)
          assert isinstance(payment.get('integrationReady'), bool)
          assert all(not str(t.get('difficulty') or '').strip() for t in data['themes'])
          print('Management settings verified')
          PY
          code=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' -H "apikey: ${key}" "${api}/admin/dashboard")
          test "$code" = "401"
          grep -q '관리자 로그인이 필요합니다' /tmp/unauthorized.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live admin site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --retry 2 --retry-all-errors -fsSL "${base}?sha=${GITHUB_SHA}" -o /tmp/admin.html; then
              if grep -q 'admin-final.js?v=' /tmp/admin.html; then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = "1"
          script_path=$(grep -oE 'assets/admin-final\.js\?v=[^" ]+' /tmp/admin.html | head -1)
          style_path=$(grep -oE 'assets/final\.css\?v=[^" ]+' /tmp/admin.html | head -1)
          date_style_path=$(grep -oE 'assets/admin-date\.css\?v=[^" ]+' /tmp/admin.html | head -1)
          test -n "$script_path"
          test -n "$style_path"
          test -n "$date_style_path"
          curl --retry 4 --retry-all-errors -fsSL "${base}${script_path}" -o /tmp/admin-final.js
          curl --retry 4 --retry-all-errors -fsSL "${base}${style_path}" -o /tmp/final.css
          curl --retry 4 --retry-all-errors -fsSL "${base}${date_style_path}" -o /tmp/admin-date.css
          node --check /tmp/admin-final.js
          test -s /tmp/final.css
          test -s /tmp/admin-date.css
          grep -q 'NICEPAY 온라인 카드 결제' /tmp/admin-final.js
          grep -q '서버 승인·웹훅 모듈' /tmp/admin-final.js
          grep -q 'NICEPAY 승인·웹훅 결과로 자동 반영됩니다' /tmp/admin-final.js
          grep -q '/admin/payments/nicepay/cancel' /tmp/admin-final.js
          grep -q 'data-confirm-nicepay-cancel' /tmp/admin-final.js
          grep -q 'VERIFYING:"결제 확인 중"' /tmp/admin-final.js
          ! grep -q 'KISPG' /tmp/admin-final.js
          grep -q '고객 사이트 이름' /tmp/admin-final.js
          grep -q '오늘 예약만 보기' /tmp/admin-final.js
          grep -q '사업자 상호' /tmp/admin-final.js
          grep -q '(주)싱글' /tmp/admin-final.js
          ! grep -q '난이도 표시' /tmp/admin-final.js
          ! grep -q 'current.difficulty' /tmp/admin-final.js
          grep -q 'noindex,nofollow,noarchive' /tmp/admin.html
          echo "Live admin site verified: ${base}"
