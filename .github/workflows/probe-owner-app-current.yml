name: Inspect corrected owner app verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-owner-app-current.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-owner-app-final.yml --limit 5 --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url > android-owner-app/ACTION_STATUS.json
          rm -f .github/workflows/probe-owner-app-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/probe-owner-app-current.yml android-owner-app/ACTION_STATUS.json
          git commit -m 'ci: record corrected owner app verification status'
          git pull --rebase origin main
          git push origin HEAD:main
