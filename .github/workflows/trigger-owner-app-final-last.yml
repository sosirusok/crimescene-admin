name: Start corrected final owner app verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-owner-app-final-last.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Start final verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-owner-app-final.yml --repo "$GITHUB_REPOSITORY" --ref main

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove this one-time trigger
        run: |
          rm -f .github/workflows/trigger-owner-app-final-last.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/trigger-owner-app-final-last.yml
          git commit -m 'chore: remove final owner app trigger'
          git pull --rebase origin main
          git push origin HEAD:main
