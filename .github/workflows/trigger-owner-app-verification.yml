name: Rerun final owner app verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-owner-app-verification.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Start final verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-owner-app-final.yml --repo "$GITHUB_REPOSITORY" --ref main

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove the one-time trigger and old status file
        run: |
          rm -f .github/workflows/trigger-owner-app-verification.yml android-owner-app/ACTION_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/trigger-owner-app-verification.yml android-owner-app/ACTION_STATUS.json
          git commit -m 'chore: remove owner app verification trigger and old status'
          git pull --rebase origin main
          git push origin HEAD:main
